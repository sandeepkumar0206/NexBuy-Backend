spring.application.name=nexbuy-backend
server.port=8080

# Load secrets from project-root .env (gitignored)
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL — values come from .env (DATABASE_* or spring.datasource.*)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Load lazy image collections for a whole page of products in one query
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Catalog
app.catalog.default-page-size=${CATALOG_DEFAULT_PAGE_SIZE:12}
app.catalog.max-page-size=${CATALOG_MAX_PAGE_SIZE:50}
# Store-wide sale percentage applied to discountedPrice (0 = no sale)
app.catalog.sale-percent=${CATALOG_SALE_PERCENT:0}

# JWT
app.jwt.secret=${JWT_SECRET:nexbuy-dev-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Seed admin (created on startup if missing)
app.admin.email=${ADMIN_EMAIL:admin@nexbuy.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:NexBuy Admin}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
