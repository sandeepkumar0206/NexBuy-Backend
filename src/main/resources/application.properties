spring.application.name=nexbuy-backend
server.port=8080

# Single .env at project root (gitignored) — used for local and prod
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origins (Angular default: http://localhost:4200)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
